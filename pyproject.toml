[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bass-transcriber"
version = "0.1.0"
description = "Transcribe songs into synchronized bass tablature for ToneLib Jam"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mido>=1.3,<2",
    "muscriptor>=0.3,<0.4",
    "torch>=2.11,<2.12",
]

[project.scripts]
bass-transcriber = "bass_transcriber.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bass_transcriber"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
environments = [
    "sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
